name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional pytest selector to run a subset of tests"
        required: false
        default: ""

env:
  PIP_INDEX_URL: https://:2022-12-07T20:13:19Z@time-machines-pypi.sealsecurity.io/

jobs:
  mypy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
      - name: Install dependencies
        run: pip install mypy
      - name: Run mypy
        run: mypy --strict certifi

  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      matrix:
        python-version:
        - "3.6"
        - "3.7"
        - "3.8"
        - "3.9"
        - "3.10"
        - "3.11-dev"
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python ${{ matrix.python-version }}
      uses: MatteoH2O1999/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        allow-build: allow
    - name: Install test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest
    - name: Test with pytest
      run: |
        python -W error -m pytest -v ${{ inputs.test-filter }}

  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"
    - name: Install build backend
      # Public wheel/sdist were built with wheel 0.37.0 and a setuptools older
      # than 62 (metadata carries "Platform: UNKNOWN").
      run: |
        python -m pip install --upgrade pip
        python -m pip install build "setuptools<62" wheel==0.37.0
    - name: Build sdist and wheel
      run: python -m build --no-isolation
    - name: Upload distributions
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/*
        if-no-files-found: error
